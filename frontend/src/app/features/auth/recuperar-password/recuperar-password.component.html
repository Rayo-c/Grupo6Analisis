<div class="contenedor" style="max-width: 420px;">
  <div class="tarjeta">
    <h2>Recuperar Contrasena</h2>

    @if (mensajeExito) { <p class="exito">{{ mensajeExito }}</p> }
    @if (errorMsg) { <p class="error">{{ errorMsg }}</p> }

    @if (pasoActual === 'solicitar') {
      <form [formGroup]="formSolicitud" (ngSubmit)="solicitar()">
        <label>Correo Electronico</label>
        <input type="email" formControlName="correo">
        <button type="submit" [disabled]="formSolicitud.invalid || cargando">
          {{ cargando ? 'Enviando...' : 'Enviar Codigo' }}
        </button>
      </form>
    } @else {
      <form [formGroup]="formReset" (ngSubmit)="restablecer()">
        <label>Codigo recibido por correo</label>
        <input formControlName="token">

        <label>Nueva Contrasena</label>
        <input type="password" formControlName="nuevaPassword">
        <small style="display:block; margin-top:-8px; margin-bottom:10px; color:#666;">
          Minimo 8 caracteres, una mayuscula, un numero y un caracter especial.
        </small>

        <button type="submit" [disabled]="formReset.invalid || cargando">
          {{ cargando ? 'Actualizando...' : 'Restablecer Contrasena' }}
        </button>
      </form>
    }

    <p style="margin-top:16px; font-size:13px;"><a routerLink="/login">Volver a Iniciar Sesion</a></p>
  </div>
</div>
