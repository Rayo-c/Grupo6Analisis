spring.application.name=quejas-quickbite
server.port=8080

# ---------------------------------------------------------------------
# Base de datos (Neon - Postgres). Estas 3 variables se definen como
# variables de entorno en la configuracion de ejecucion (ver captura:
# Run/Debug Configurations > Environment Variables), NUNCA hardcodeadas
# aqui ni commiteadas al repositorio.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon usa PgBouncer (pooler) en el string de conexion "-pooler"; el pool
# de Hibernate/HikariCP debe mantenerse chico porque Neon limita conexiones
# concurrentes en el plan free.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# validate: NO crea ni modifica tablas, solo valida que el esquema ya
# exista y coincida con las entidades. Requiere correr antes el script
# db/schema.sql (o dejar que Hibernate las cree una vez con
# ddl-auto=update y luego volver a "validate").
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

